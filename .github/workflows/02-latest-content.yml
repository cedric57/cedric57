# 02-latest-content.yml — derniers articles du hub + dernière vidéo LONGUE (Shorts exclus)
name: 02 · Derniers contenus

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derniers articles du hub (RSS)
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://cedric-grun.fr/rss.xml"
          comment_tag_name: BLOG-POST-LIST
          max_post_count: 3
          commit_message: "chore: maj derniers articles"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dernière vidéo longue (Shorts exclus)
        run: node .github/scripts/02-latest-long-video.mjs

      - name: Commit si la vidéo a changé
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: maj dernière vidéo longue"
          file_pattern: README.md
