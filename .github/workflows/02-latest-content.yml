# 02-latest-content.yml — derniers articles du hub + dernière vidéo YouTube
name: 02 · Derniers contenus

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derniers articles du hub (RSS)
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://cedric-grun.fr/rss.xml"
          comment_tag_name: BLOG-POST-LIST
          max_post_count: 3
          commit_message: "chore: maj derniers articles"

      - name: Dernière vidéo YouTube
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCX_e4D9B0Z_Drh19cWc4SgA"
          comment_tag_name: YOUTUBE-VIDEOS-LIST
          max_post_count: 1
          template: "- [$title]($url)"
          commit_message: "chore: maj dernière vidéo"
